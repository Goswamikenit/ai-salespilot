services:
  postgres:
    image: postgres:16
    container_name: ai-salespilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salespilot
      POSTGRES_PASSWORD: salespilot_password
      POSTGRES_DB: salespilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: